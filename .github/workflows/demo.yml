name: Demo CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print hello
        run: echo "Hello from Actions! Demo works"
      - name: Show date
        run: date
      - name: List files
        run: ls -la
